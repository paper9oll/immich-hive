services:
  immich-hive:
    image: ghcr.io/paper9oll/immich-hive:latest
    container_name: immich-hive
    environment:
      LANG: 'en_GB'
      TZ: 'Europe/London'
    ports:
      - 3000:3000
    volumes:
      - ./config:/config
      # - ./custom.css:/custom.css
      # - ./offline-assets:/offline-assets
    healthcheck:
      test: ['CMD', '/kiosk', '--healthcheck']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
