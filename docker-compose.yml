services:
  immich-hive:
    image: ghcr.io/paper9oll/immich-hive:latest
    container_name: immich-hive
    environment:
      LANG: 'en_GB'
      TZ: 'Europe/London'
      # Required settings
      KIOSK_IMMICH_API_KEY: ''
      KIOSK_IMMICH_URL: 'http://immich-server:2283'
      # External url for image links/QR codes
      KIOSK_IMMICH_EXTERNAL_URL: ''
      # Clock
      KIOSK_SHOW_TIME: true
      KIOSK_TIME_FORMAT: 12
      KIOSK_SHOW_DATE: true
      KIOSK_DATE_FORMAT: 'DDD, MMM D'
      KIOSK_CLOCK_SOURCE: client
      # Kiosk behaviour
      KIOSK_DURATION: 5
      KIOSK_DISABLE_SCREENSAVER: false
      KIOSK_OPTIMIZE_IMAGES: false
      KIOSK_USE_GPU: true
      KIOSK_BURN_IN_INTERVAL: 0
      KIOSK_BURN_IN_DURATION: 30
      KIOSK_BURN_IN_OPACITY: 70
      # Asset sources
      KIOSK_SHOW_ARCHIVED: false
      KIOSK_ALBUMS: ''
      KIOSK_ALBUM_ORDER: random
      KIOSK_EXCLUDED_ALBUMS: ''
      KIOSK_PEOPLE: ''
      KIOSK_REQUIRE_ALL_PEOPLE: false
      KIOSK_EXCLUDED_PEOPLE: ''
      KIOSK_DATES: ''
      KIOSK_TAGS: ''
      KIOSK_EXCLUDED_TAGS: ''
      KIOSK_RATING: -1
      KIOSK_EXCLUDED_PARTNERS: ''
      KIOSK_MEMORIES: false
      KIOSK_BLACKLIST: ''
      # FILTER
      KIOSK_FILTER_DATE: ''
      KIOSK_FILTER_NEWEST: 0
      KIOSK_FILTER_EXCLUDE_FACES: false
      KIOSK_FILTER_FAVORITES: false
      # UI
      KIOSK_SHOW_PROGRESS_BAR: false
      KIOSK_DISABLE_NAVIGATION: true
      KIOSK_DISABLE_UI: false
      KIOSK_FRAMELESS: true
      KIOSK_HIDE_CURSOR: false
      KIOSK_FONT_SIZE: 100
      KIOSK_BACKGROUND_BLUR: false
      KIOSK_BACKGROUND_BLUR_AMOUNT: 10
      KIOSK_THEME: fade
      KIOSK_LAYOUT: splitview
      KIOSK_SHOW_USER: false
      # Sleep mode
      # KIOSK_SLEEP_START: 22
      # KIOSK_SLEEP_END: 7
      # KIOSK_SLEEP_DIM_SCREEN: false
      # Transistion options
      KIOSK_TRANSITION: none
      KIOSK_FADE_TRANSITION_DURATION: 1
      KIOSK_CROSS_FADE_TRANSITION_DURATION: 1
      KIOSK_SLIDE_TRANSITION_DURATION: 2
      KIOSK_PUSH_TRANSITION_DURATION: 3
      # Image display settings
      KIOSK_IMAGE_FIT: cover
      KIOSK_IMAGE_EFFECT: smart-zoom
      KIOSK_IMAGE_EFFECT_AMOUNT: 100
      KIOSK_USE_ORIGINAL_IMAGE: false
      # Video
      KIOSK_SHOW_VIDEOS: false
      KIOSK_LIVE_PHOTOS: false
      KIOSK_LIVE_PHOTO_LOOP_DELAY: 0
      KIOSK_SHOW_ANIMATED_GIFS: false
      # Image metadata
      KIOSK_SHOW_IMAGE_RATING: false
      KIOSK_SHOW_OWNER: false
      KIOSK_SHOW_ALBUM_NAME: false
      KIOSK_SHOW_PERSON_NAME: false
      KIOSK_SHOW_PERSON_AGE: false
      KIOSK_SHOW_IMAGE_TIME: false
      KIOSK_IMAGE_TIME_FORMAT: 24
      KIOSK_SHOW_IMAGE_DATE: false
      KIOSK_IMAGE_DATE_FORMAT: YYYY-MM-DD
      KIOSK_SHOW_IMAGE_DESCRIPTION: false
      KIOSK_SHOW_IMAGE_CAMERA: false
      KIOSK_SHOW_IMAGE_EXIF: false
      KIOSK_SHOW_IMAGE_LOCATION: false
      KIOSK_HIDE_COUNTRIES: ''
      KIOSK_SHOW_IMAGE_ID: false
      KIOSK_SHOW_IMAGE_QR: false
      # More info overlay
      KIOSK_MORE_INFO_DISPLAY: false
      KIOSK_MORE_INFO_LIKE_BUTTON_ACTION: favorite
      KIOSK_MORE_INFO_HIDE_BUTTON_ACTION: tag
      KIOSK_MORE_INFO_SHOW_ASSET_LINK: false
      KIOSK_MORE_INFO_SHOW_QR_CODE: false
      KIOSK_MORE_INFO_SHOW_RATING: false
      KIOSK_MORE_INFO_SHOW_LIKE_BUTTON: false
      KIOSK_MORE_INFO_SHOW_HIDE_BUTTON: false
      # Kiosk settings
      KIOSK_PORT: 3000
      KIOSK_BEHIND_PROXY: false
      KIOSK_DISABLE_URL_QUERIES: true
      KIOSK_DISABLE_CONFIG_ENDPOINT: false
      KIOSK_ENABLE_URL_BUILDER: false
      KIOSK_WATCH_CONFIG: false
      KIOSK_FETCHED_ASSETS_SIZE: 1000
      KIOSK_HTTP_TIMEOUT: 20
      KIOSK_PASSWORD: ''
      KIOSK_CACHE: true
      KIOSK_PREFETCH: true
      KIOSK_ASSET_WEIGHTING: true
    ports:
      - 3000:3000
    # volumes:
    # - ./custom.css:/custom.css
    # - ./offline-assets:/offline-assets
    healthcheck:
      test: ['CMD', '/kiosk', '--healthcheck']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
